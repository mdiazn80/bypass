name: Checks

# Lint and tests for the frontend and the Rust workspace, on every pull request
# into `develop` or `main` and on pushes to `develop`. The steps live in
# `.github/actions/checks`, which the release workflow also runs before tagging.
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and test
    # macOS: the app crate links the keychain and Touch ID code paths.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: .

      - name: Lint and test
        uses: ./.github/actions/checks
