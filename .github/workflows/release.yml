name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo validar VERSION; no crear tag, builds ni release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Validar VERSION y crear tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer y validar VERSION
        id: meta
        run: |
          set -euo pipefail
          RAW="$(tr -d ' \t\r\n' < VERSION)"
          if [[ ! "$RAW" =~ ^[0-9]{2}\.([1-9]|1[0-2])\.[0-9]+$ ]]; then
            echo "::error::VERSION debe cumplir YY.M.X (año 2 dígitos, mes 1-12 sin cero a la izquierda, secuencia numérica). Valor actual: '$RAW'"
            exit 1
          fi
          TAG="v${RAW}"
          echo "version=${RAW}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versión: ${RAW} → tag ${TAG}"

      - name: Comprobar que el tag no exista
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse "${{ steps.meta.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "::error::El tag ${{ steps.meta.outputs.tag_name }} ya existe. Incrementa la secuencia en VERSION."
            exit 1
          fi

      - name: Crear y publicar tag
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.tag_name }}" -m "Release ${{ steps.meta.outputs.version }}"
          git push origin "${{ steps.meta.outputs.tag_name }}"

  build-macos:
    name: Build (macOS)
    needs: tag
    if: ${{ !inputs.dry_run }}
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout en el tag de release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag_name }}
          fetch-depth: 0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Alinear versión desde VERSION
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const v = fs.readFileSync("VERSION", "utf8").trim().replace(/\s+/g, "");
          if (!/^\d{2}\.([1-9]|1[0-2])\.\d+$/.test(v)) {
            console.error("VERSION inválida:", v);
            process.exit(1);
          }
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.version = v;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          const tauriPath = "src-tauri/tauri.conf.json";
          const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
          tauri.version = v;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");
          let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
          fs.writeFileSync("src-tauri/Cargo.toml", cargo);
          console.log("Versión aplicada:", v);
          NODE

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            pnpm tauri build
          else
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY no definido; se omite firma de updater y code signing"
            pnpm tauri build --no-sign -c '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Empaquetar artefactos del bundle
        run: |
          set -euo pipefail
          OUT="release-assets-macos"
          mkdir -p "$OUT"
          shopt -s globstar nullglob || true
          cp -R src-tauri/target/release/bundle/dmg/* "$OUT/" 2>/dev/null || true
          cp -R src-tauri/target/release/bundle/macos/* "$OUT/" 2>/dev/null || true
          cp src-tauri/target/release/bundle/**/*.sig "$OUT/" 2>/dev/null || true
          if [[ -z "$(find "$OUT" -mindepth 1 -maxdepth 1 2>/dev/null | head -1)" ]]; then
            echo "::error::No se encontraron artefactos en $OUT"
            find src-tauri/target/release/bundle -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          ls -la "$OUT"

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: bypass-macos-${{ needs.tag.outputs.version }}
          path: release-assets-macos/*
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    needs: tag
    if: ${{ !inputs.dry_run }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout en el tag de release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag_name }}
          fetch-depth: 0

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Alinear versión desde VERSION
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const v = fs.readFileSync("VERSION", "utf8").trim().replace(/\s+/g, "");
          if (!/^\d{2}\.([1-9]|1[0-2])\.\d+$/.test(v)) {
            console.error("VERSION inválida:", v);
            process.exit(1);
          }
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.version = v;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          const tauriPath = "src-tauri/tauri.conf.json";
          const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
          tauri.version = v;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");
          let cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          cargo = cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`);
          fs.writeFileSync("src-tauri/Cargo.toml", cargo);
          console.log("Versión aplicada:", v);
          NODE

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            pnpm tauri build
          else
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY no definido; se omite firma de updater y code signing"
            pnpm tauri build --no-sign -c '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Empaquetar artefactos del bundle
        run: |
          set -euo pipefail
          OUT="release-assets-windows"
          mkdir -p "$OUT"
          shopt -s globstar nullglob || true
          cp -R src-tauri/target/release/bundle/msi/* "$OUT/" 2>/dev/null || true
          cp -R src-tauri/target/release/bundle/nsis/* "$OUT/" 2>/dev/null || true
          cp src-tauri/target/release/bundle/**/*.sig "$OUT/" 2>/dev/null || true
          if [[ -z "$(find "$OUT" -mindepth 1 -maxdepth 1 2>/dev/null | head -1)" ]]; then
            echo "::error::No se encontraron artefactos en $OUT"
            find src-tauri/target/release/bundle -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          ls -la "$OUT"

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: bypass-windows-${{ needs.tag.outputs.version }}
          path: release-assets-windows/*
          if-no-files-found: error

  publish:
    name: Publicar GitHub Release
    needs: [tag, build-macos, build-windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bypass-*
          merge-multiple: true

      - name: Crear release y adjuntar binarios
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag_name }}
          name: Bypass ${{ needs.tag.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
