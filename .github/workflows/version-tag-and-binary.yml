name: Version tag and binary

# Runs when a pull request into `main` is merged (after approval), from any branch.
# Can also be run manually (Actions → Run workflow).
#
# One macOS job, in this order, so nothing is published when a step fails:
# 1. Write the next version into the working tree (no commit, no tag yet).
# 2. Lint, test and compile the release workspace (`.github/actions/checks`).
# 3. Bundle, sign and notarize that same release build. The frontend dist and
#    target/release are reused; dependencies are not compiled again.
# 4. Commit and push the version tag only after the signed build exists.
# 5. Upload:
#    - macOS Apple Silicon (signed + notarized DMG + app.tar.gz for updater) — arm64
#    - latest.json — updater manifest consumed by tauri-plugin-updater (separate job)
#
# Notarization: APPLE_ID (email), APPLE_PASSWORD (app-specific password, appleid.apple.com), APPLE_TEAM_ID.
# Certificate: Developer ID Application in the .p12 (Apple Development cannot notarize for distribution).
#
# Shell logic lives in scripts/ at repo root.
on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-tag-and-release-binaries-desktop-notarize
  cancel-in-progress: false

jobs:
  release-macos-arm64:
    name: Check, tag, build, sign & notarize desktop (DMG, macOS Apple Silicon)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: macos-26
    outputs:
      tag: ${{ steps.version_tag.outputs.tag }}
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}

      - name: pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: .

      # Before any release compile. The checks step builds target/release.
      - name: protobuf
        run: brew install protobuf

      # Version files change the crate fingerprint, so they are written before
      # compiling. A failure below still leaves no commit or tag: publish runs
      # only after the signed build. Signing secrets are not in the environment
      # yet, so dependency install scripts and tests never see them.
      - name: Prepare version
        id: version_tag
        env:
          TZ: UTC
        run: bash scripts/ci-tag-version-push.sh prepare

      - name: Lint and test
        uses: ./.github/actions/checks

      # Bundles the release binaries just compiled. CI_REUSE_FRONTEND skips the
      # second pnpm install and the second frontend build.
      - name: Build, sign, notarize, normalize DMG
        env:
          CI_REUSE_FRONTEND: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/ci-macos-release-signed-only.sh

      - name: Create and push tag
        env:
          TZ: UTC
          TAG: ${{ steps.version_tag.outputs.tag }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/ci-tag-version-push.sh publish

      - name: Prepare macOS updater artifact
        env:
          TAG: ${{ steps.version_tag.outputs.tag }}
        run: |
          mkdir -p dist
          python3 << 'PY'
          import glob, json, os, shutil

          tag = os.environ["TAG"]
          bundle = "target/release/bundle"

          tars = glob.glob(f"{bundle}/macos/*.app.tar.gz")
          if not tars:
              raise SystemExit(f"No .app.tar.gz found under {bundle}/macos/")
          app_tar = tars[0]
          sig_path = app_tar + ".sig"

          shutil.copy(app_tar, "dist/Bypass-arm64.app.tar.gz")

          with open(sig_path) as f:
              signature = f.read().strip()

          fragment = {
              "url": f"https://github.com/mdiazn80/bypass/releases/download/{tag}/Bypass-arm64.app.tar.gz",
              "signature": signature,
          }
          with open("updater-darwin-aarch64.json", "w") as f:
              json.dump(fragment, f)

          print(f"macOS updater artifact: {os.path.basename(app_tar)}")
          PY

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version_tag.outputs.tag }}
          files: target/release/bundle/dmg/Bypass-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload app tarball to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version_tag.outputs.tag }}
          files: dist/Bypass-arm64.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload darwin-aarch64 updater fragment
        uses: actions/upload-artifact@v7
        with:
          name: updater-darwin-aarch64
          path: updater-darwin-aarch64.json

  publish-updater:
    name: Publish updater manifest (latest.json)
    needs: release-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci-publish-updater-manifest.sh
          sparse-checkout-cone-mode: false

      - name: Download darwin-aarch64 updater fragment
        uses: actions/download-artifact@v7
        with:
          name: updater-darwin-aarch64
          path: darwin-aarch64/

      - name: Assemble latest.json
        env:
          TAG: ${{ needs.release-macos-arm64.outputs.tag }}
        run: bash scripts/ci-publish-updater-manifest.sh

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-macos-arm64.outputs.tag }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
