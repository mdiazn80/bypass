name: Version tag and binary

# Runs when a pull request from branch `develop` into `main` is merged (after approval).
# Can also be run manually (Actions → Run workflow).
#
# Builds and uploads:
# - macOS Apple Silicon (signed + notarized DMG + app.tar.gz for updater) — arm64
# - latest.json — updater manifest consumed by tauri-plugin-updater
#
# Notarization: APPLE_ID (email), APPLE_PASSWORD (app-specific password, appleid.apple.com), APPLE_TEAM_ID.
# Certificate: Developer ID Application in the .p12 (Apple Development cannot notarize for distribution).
#
# Shell logic lives in scripts/ at repo root.
on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-tag-and-release-binaries-desktop-notarize
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version_tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.merge_commit_sha }}

      - name: Create and push tag
        id: version_tag
        env:
          TZ: UTC
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash scripts/ci-tag-version-push.sh

  build-macos-arm64:
    name: Build, sign & notarize desktop (DMG, macOS Apple Silicon)
    needs: tag
    runs-on: macos-26
    env:
      CI: true
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.tag.outputs.tag }}

      - name: pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: .

      - name: Build, sign, notarize, normalize DMG
        run: bash scripts/ci-macos-release-signed-only.sh

      - name: Prepare macOS updater artifact
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          mkdir -p dist
          python3 << 'PY'
          import glob, json, os, shutil

          tag = os.environ["TAG"]
          bundle = "target/release/bundle"

          tars = glob.glob(f"{bundle}/macos/*.app.tar.gz")
          if not tars:
              raise SystemExit(f"No .app.tar.gz found under {bundle}/macos/")
          app_tar = tars[0]
          sig_path = app_tar + ".sig"

          shutil.copy(app_tar, "dist/Bypass-arm64.app.tar.gz")

          with open(sig_path) as f:
              signature = f.read().strip()

          fragment = {
              "url": f"https://github.com/mdiazn80/bypass/releases/download/{tag}/Bypass-arm64.app.tar.gz",
              "signature": signature,
          }
          with open("updater-darwin-aarch64.json", "w") as f:
              json.dump(fragment, f)

          print(f"macOS updater artifact: {os.path.basename(app_tar)}")
          PY

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: target/release/bundle/dmg/Bypass-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload app tarball to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: dist/Bypass-arm64.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload darwin-aarch64 updater fragment
        uses: actions/upload-artifact@v7
        with:
          name: updater-darwin-aarch64
          path: updater-darwin-aarch64.json

  publish-updater:
    name: Publish updater manifest (latest.json)
    needs: [tag, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci-publish-updater-manifest.sh
          sparse-checkout-cone-mode: false

      - name: Download darwin-aarch64 updater fragment
        uses: actions/download-artifact@v7
        with:
          name: updater-darwin-aarch64
          path: darwin-aarch64/

      - name: Assemble latest.json
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: bash scripts/ci-publish-updater-manifest.sh

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
