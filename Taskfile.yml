version: "3"

tasks:
  default:
    desc: Lista las tareas disponibles
    silent: true
    cmds:
      - task --list

  install:
    desc: Instala dependencias del frontend con pnpm
    cmds:
      - pnpm install

  dev:
    desc: Arranca la app en modo desarrollo (Vite + Tauri)
    cmds:
      - pnpm tauri dev

  build:
    desc: Release completo (requiere TAURI_SIGNING_PRIVATE_KEY si createUpdaterArtifacts está activo)
    cmds:
      - pnpm tauri build

  build:local:
    desc: Build local sin artefactos de updater ni code signing (evita TAURI_SIGNING_PRIVATE_KEY)
    cmds:
      - pnpm tauri build --no-sign -c '{"bundle":{"createUpdaterArtifacts":false}}'

  build:frontend:
    desc: Solo compila el frontend (tsc + vite build), sin empaquetar Tauri
    cmds:
      - pnpm build

  preview:
    desc: Sirve el build de Vite en local (sin ventana nativa de Tauri)
    cmds:
      - pnpm preview

  clean:
    desc: Borra dist del frontend y el target de Rust (cargo clean)
    cmds:
      - rm -rf "{{.TASKFILE_DIR}}/dist"
      - cargo clean --manifest-path "{{.TASKFILE_DIR}}/src-tauri/Cargo.toml"

  clean:all:
    desc: Limpia artefactos de compilación y node_modules
    deps: [clean]
    cmds:
      - rm -rf "{{.TASKFILE_DIR}}/node_modules"

  info:
    desc: Muestra el entorno detectado por el CLI de Tauri
    cmds:
      - pnpm tauri info
