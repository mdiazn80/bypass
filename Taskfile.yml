version: "3"

vars:
  APP_NAME: bypass
  PKG_MGR: pnpm

tasks:
  install:
    desc: Install frontend dependencies
    cmds:
      - echo "Installing desktop dependencies (pnpm)..."
      - "{{.PKG_MGR}} install"

  dev:
    desc: Run Tauri app in development mode
    cmds:
      - pnpm tauri dev

  build:
    desc: Build the Tauri app for production
    cmds:
      - pnpm tauri build

  build:debug:
    desc: Build the Tauri app in debug mode
    cmds:
      - pnpm tauri build --debug

  build:
    desc: Tauri release for this host OS (dispatches by OS)
    cmds:
      - bash scripts/build-dispatch.sh "{{OS}}" "{{ARCH}}"

  build:macos:
    desc: Tauri release on macOS Apple Silicon
    preconditions:
      - sh: 'test "{{OS}}" = "darwin"'
        msg: Run on macOS only.
      - sh: 'test "{{ARCH}}" = "arm64"'
        msg: Only Apple Silicon (arm64) is supported for this desktop build on macOS.
    cmds:
      - echo "Building desktop Tauri release on macOS (arm64)..."
      - "{{.PKG_MGR}} tauri build"

  build:linux:
    desc: Tauri release on Linux only
    preconditions:
      - sh: 'test "{{OS}}" = "linux"'
        msg: Run this task on Linux only (native).
    cmds:
      - echo "Building desktop Tauri release on Linux..."
      - "{{.PKG_MGR}} tauri build"

  build:windows:
    desc: Tauri release on Windows only
    preconditions:
      - sh: 'test "{{OS}}" = "windows"'
        msg: Run this task on Windows only (native). Use Git Bash if preconditions fail.
    cmds:
      - echo "Building desktop Tauri release on Windows..."
      - "{{.PKG_MGR}} tauri build"

  clean:
    desc: Clean build artifacts (frontend and Rust)
    cmds:
      - rm -rf dist
      - cd src-tauri && cargo clean

  clean:frontend:
    desc: Clean only frontend build artifacts
    cmds:
      - rm -rf dist

  clean:rust:
    desc: Clean only Rust build artifacts
    cmds:
      - cd src-tauri && cargo clean

  lint:
    desc: Run TypeScript type checking
    cmds:
      - pnpm tsc --noEmit

  fmt:
    desc: Format Rust code
    cmds:
      - cd src-tauri && cargo fmt

  fmt:check:
    desc: Check Rust code formatting
    cmds:
      - cd src-tauri && cargo fmt --check

  clippy:
    desc: Run Clippy linter on Rust code
    cmds:
      - cd src-tauri && cargo clippy -- -D warnings

  check:
    desc: Run all checks (lint + fmt + clippy)
    deps:
      - lint
      - fmt:check
      - clippy

  update:
    desc: Update frontend and Rust dependencies
    cmds:
      - pnpm update
      - cd src-tauri && cargo update

  icons:
    desc: Generate app icons from a source image
    cmds:
      - pnpm tauri icon {{.CLI_ARGS}}

  keys:generate:
    desc: Generate new Tauri updater signing keys (saved to ~/.tauri/)
    cmds:
      - |
        mkdir -p .tauri
        echo ""
        echo "Generating new Tauri signing keys..."
        echo "You will be asked for a password. Use an EMPTY password (just press Enter twice) to avoid CI issues."
        echo ""
        pnpm tauri signer generate -w .tauri/bypass.key
        echo ""
        echo "Keys saved to:"
        echo "  Private: .tauri/bypass.key"
        echo "  Public:  .tauri/bypass.key.pub"

  keys:apply:
    desc: Apply public key from .tauri/bypass.key.pub to tauri.conf.json
    cmds:
      - |
        PUBKEY=$(cat .tauri/bypass.key.pub)
        node -e "
          const fs = require('fs');
          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          conf.plugins.updater.pubkey = '$PUBKEY';
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
        "
        echo "Public key applied to src-tauri/tauri.conf.json"
        echo ""
        echo "Now update your GitHub secrets:"
        echo "  TAURI_SIGNING_PRIVATE_KEY = contents of .tauri/bypass.key"
        echo "  TAURI_SIGNING_PRIVATE_KEY_PASSWORD = the password you used (empty string if none)"
