version: "3"

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install frontend dependencies with pnpm
    cmds:
      - pnpm install

  dev:
    desc: Start the app in development mode (Vite + Tauri)
    cmds:
      - pnpm tauri dev

  build:
    desc: Full release (requires TAURI_SIGNING_PRIVATE_KEY if createUpdaterArtifacts is enabled)
    cmds:
      - pnpm tauri build

  build:local:
    desc: Local build without updater artifacts or code signing (avoids TAURI_SIGNING_PRIVATE_KEY)
    # CI=true makes Tauri pass --sandbox-safe to bundle_dmg.sh, skipping the Finder
    # AppleScript layout step that requires Automation permission on the terminal.
    env:
      CI: "true"
    cmds:
      - pnpm tauri build --no-sign -c '{"bundle":{"createUpdaterArtifacts":false}}'

  build:frontend:
    desc: Build only the frontend (tsc + vite build), without packaging Tauri
    cmds:
      - pnpm build

  preview:
    desc: Serve the Vite build locally (without the native Tauri window)
    cmds:
      - pnpm preview

  clean:
    desc: Remove the frontend dist and the Rust target (cargo clean)
    cmds:
      - rm -rf "{{.TASKFILE_DIR}}/dist"
      - cargo clean --manifest-path "{{.TASKFILE_DIR}}/src-tauri/Cargo.toml"

  clean:all:
    desc: Clean build artifacts and node_modules
    deps: [clean]
    cmds:
      - rm -rf "{{.TASKFILE_DIR}}/node_modules"

  info:
    desc: Show the environment detected by the Tauri CLI
    cmds:
      - pnpm tauri info
